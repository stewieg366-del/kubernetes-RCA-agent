apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: rca-demo
data:
  default.conf: |
    server {
        listen 80;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
        set $upstream http://payment.rca-demo.svc.cluster.local;
        location / {
            proxy_pass $upstream;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: rca-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: checkout
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: config-volume
        configMap:
          name: checkout-config
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: rca-demo
spec:
  selector:
    app: checkout
  ports:
  - port: 80
    targetPort: 80
