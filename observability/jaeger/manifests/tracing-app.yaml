apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-frontend
  namespace: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-frontend
  template:
    metadata:
      labels:
        app: trace-frontend
    spec:
      containers:
        - name: trace-frontend
          image: trace-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: trace-frontend
  namespace: jaeger
spec:
  selector:
    app: trace-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
